# Nginx serves the static web UI and forwards /api to the API container.
# The browser only ever talks to Nginx — the API is not exposed directly.
server {
    listen 8080;                      # unprivileged port (non-root containers cannot bind to 80)
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                # do not reveal the Nginx version
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Health check for the web container itself
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API and readiness go to the "api" service (Docker Compose / Kubernetes DNS name)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /readyz {
        proxy_pass http://api:3000;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
