<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopOps — Inventory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▣</span> ShopOps <small>Inventory</small></div>
  <div class="status"><span id="health" class="dot"></span><span id="health-text">checking…</span> · <span id="version">v—</span></div>
</header>

<main>
  <section class="card">
    <h2>Add product</h2>
    <form id="add-form">
      <label>Name <input name="name" required maxlength="120" placeholder="Golden Pump 1HP"></label>
      <label>Category
        <select name="category">
          <option value="pump">Pump</option><option value="wire">Wire</option>
          <option value="safety_cable">Safety cable</option><option value="other">Other</option>
        </select>
      </label>
      <label>Price (Rs) <input name="price" type="number" min="0" step="1" required></label>
      <label>Quantity <input name="quantity" type="number" min="0" step="1" required></label>
      <button type="submit">Add</button>
    </form>
    <p id="form-msg" class="msg" role="status"></p>
  </section>

  <section class="card">
    <div class="row"><h2>Stock</h2><span id="count" class="muted"></span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Qty</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
