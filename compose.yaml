# ShopOps — local stack: PostgreSQL + Inventory API + Web (Nginx)
# Start:  docker compose up -d --build      Open: http://localhost:8080
# Stop:   docker compose down               (data is kept in the db-data volume)
# Reset:  docker compose down -v            (also deletes the database)
name: shopops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopops
      POSTGRES_USER: shopops
      # Read from the .env file next to this file. Compose stops with an error if it is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data      # data survives container restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopops -d shopops"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No "ports:" — the database is reachable only from inside the Compose network.

  api:
    build:
      context: ./app/api
      target: runtime
    image: shopops-api:local
    environment:
      DATABASE_URL: postgres://shopops:${POSTGRES_PASSWORD}@db:5432/shopops
      LOG_LEVEL: info
      APP_VERSION: ${APP_VERSION:-0.2.0-local}
    depends_on:
      db:
        condition: service_healthy            # wait until PostgreSQL accepts connections
    init: true                                # tiny init process: forwards signals, reaps zombies
    read_only: true                           # the container's filesystem is read-only…
    tmpfs:
      - /tmp                                  # …except a small scratch area in memory
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # No "ports:" — only the web container talks to the API.

  web:
    build: ./app/web
    image: shopops-web:local
    ports:
      - "8080:8080"                           # the only port opened on your Mac
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
