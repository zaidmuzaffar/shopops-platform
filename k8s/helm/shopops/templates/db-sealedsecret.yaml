{{- if .Values.db.sealedPassword }}
# The database password, encrypted for this cluster's Sealed Secrets controller (Phase 7).
# Git holds only ciphertext: the controller, which keeps the private key inside the cluster,
# turns it back into the Secret that the database and the API read. The value is sealed for
# one namespace, one Secret name and one cluster: re-seal it when any of those change
# (command in values.yaml).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.db.existingSecret }}
  labels:
    app: db
    {{- include "shopops.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{ .Values.db.passwordKey }}: {{ .Values.db.sealedPassword | quote }}
  template:
    metadata:
      name: {{ .Values.db.existingSecret }}
      labels:
        app: db
        {{- include "shopops.podLabels" . | nindent 8 }}
{{- end }}
