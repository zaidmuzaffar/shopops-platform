# Default values (local k3d cluster). Override per environment with -f values-<env>.yaml
# or single values with --set, e.g. --set api.autoscaling.maxReplicas=8

images:
  api:
    repository: shopops-api
    tag: "0.5.0"      # built locally and loaded with: k3d image import shopops-api:0.5.0 -c shopops
  web:
    repository: shopops-web
    tag: local
  db:
    repository: postgres
    tag: 16-alpine
  pullPolicy: IfNotPresent

db:
  name: shopops
  user: shopops
  existingSecret: shopops-db      # the Secret the database and the API read the password from
  passwordKey: POSTGRES_PASSWORD
  # The password sealed for this cluster's Sealed Secrets controller: safe to commit, opens
  # only inside this cluster. Empty = no SealedSecret; create the Secret by hand instead.
  # Seal (or re-seal) the current password and print the value to paste here:
  #   kubectl -n shopops get secret shopops-db -o jsonpath='{.data.POSTGRES_PASSWORD}' \
  #     | base64 -d | kubeseal --raw --namespace shopops --name shopops-db
  sealedPassword: ""
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

backup:
  enabled: true
  schedule: "0 8 * * *"   # every day at 08:00 UTC (13:00 in Pakistan); a run missed while the
                          # laptop was off starts as soon as the cluster is back
  keep: 7                 # how many dumps to keep on the volume
  storage: 1Gi            # a volume in the same cluster is not an off-site copy: in the cloud
                          # week the dumps also go to S3
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

api:
  logLevel: info
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

web:
  replicas: 3
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

ingress:
  enabled: true
  className: traefik
  host: ""          # empty = answer on any host name (fine for localhost)

podDisruptionBudget:
  enabled: true
  minAvailable: 1

monitoring:
  enabled: true                   # ServiceMonitor, alert rules and Grafana dashboard (needs kube-prometheus-stack)
  prometheusRelease: monitoring   # kube-prometheus-stack only picks up objects labelled release=<its Helm release name>
