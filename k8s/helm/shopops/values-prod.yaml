# Example production overrides: same chart, bigger settings.
# Preview without installing:  helm template shopops k8s/helm/shopops -f k8s/helm/shopops/values-prod.yaml
images:
  api:
    repository: ghcr.io/zaidmuzaffar/shopops-api
    tag: latest
  web:
    repository: ghcr.io/zaidmuzaffar/shopops-web
    tag: latest
  pullPolicy: Always

db:
  storage: 10Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

api:
  logLevel: warn
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

web:
  replicas: 3

ingress:
  host: shop.example.com
  tls:
    issuer: letsencrypt        # a Let's Encrypt (ACME) Issuer, created for the cloud deploy
    localCA: false
    redirectPort: ""           # standard port 443
