# Autoscaling: keep average CPU of the API pods around 60% of their request.
# Under load Kubernetes adds pods (up to 5); when it is quiet it goes back to 2.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # wait 1 minute of calm before removing pods
