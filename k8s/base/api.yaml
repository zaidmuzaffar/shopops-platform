# The inventory API: 2 replicas, health probes, resource limits, locked-down security.
apiVersion: v1
kind: Service
metadata:
  name: api            # the name Nginx uses: proxy_pass http://api:3000
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  # No "replicas" here: the HorizontalPodAutoscaler (hpa.yaml) owns the pod count (2 to 5).
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # updates never drop below 2 ready pods
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the "node" user inside the image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: shopops-api:local
          imagePullPolicy: IfNotPresent    # the image was imported into k3d, not pulled
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: shopops-db, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL           # $(VAR) is filled in by Kubernetes from the line above
              value: postgres://shopops:$(POSTGRES_PASSWORD)@db:5432/shopops
            - name: LOG_LEVEL
              value: info
            - name: APP_VERSION
              value: 0.4.0-k8s
          # Liveness: "is the process alive?" -> if not, Kubernetes restarts the container.
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # Readiness: "can it serve traffic right now (DB reachable)?" -> if not, no traffic is sent to it.
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
