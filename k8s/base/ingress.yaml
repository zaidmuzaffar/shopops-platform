# Entry point from outside the cluster. k3d's load balancer maps your Mac's port 8081
# to port 80 of the cluster, where the built-in Traefik ingress controller listens.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopops
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
